name: Bug Report
description: Create a report to help us improve FocusContract
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: input
    id: os-version
    attributes:
      label: Windows Version
      description: What version of Windows are you running? (e.g. Windows 11 23H2)
      placeholder: Windows 11 Pro 64-bit
    validations:
      required: true
  - type: textarea
    id: targets
    attributes:
      label: Target Applications
      description: What executables or applications were you tracking?
      placeholder: e.g. valorant-win64-shipping.exe, steam.exe
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step by step instructions to reproduce the issue.
      placeholder: |
        1. Set budget to 1 min
        2. Launch game
        3. Wait for strikes
    validations:
      required: true
